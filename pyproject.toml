[project]
name = "command-pattern"
version = "0.1.0"
description = "A simple text editor to practice the command design pattern"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
command-pattern = "command_pattern.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
